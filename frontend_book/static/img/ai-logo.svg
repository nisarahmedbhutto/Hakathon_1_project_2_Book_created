<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Robot head with neural network pattern -->
  <rect x="20" y="20" width="60" height="60" rx="15" fill="#4ecdc4"/>

  <!-- Eyes -->
  <circle cx="35" cy="40" r="5" fill="#1a535c"/>
  <circle cx="65" cy="40" r="5" fill="#1a535c"/>

  <!-- Neural network connections -->
  <line x1="35" y1="45" x2="50" y2="55" stroke="#1a535c" stroke-width="2"/>
  <line x1="65" y1="45" x2="50" y2="55" stroke="#1a535c" stroke-width="2"/>
  <line x1="50" y1="55" x2="50" y2="70" stroke="#1a535c" stroke-width="2"/>

  <!-- Mouth/speaker -->
  <rect x="40" y="65" width="20" height="5" rx="2" fill="#1a535c"/>

  <!-- Decorative circuit pattern -->
  <path d="M20 80 Q30 85 40 80" stroke="#1a535c" stroke-width="1" fill="none"/>
  <path d="M60 80 Q70 85 80 80" stroke="#1a535c" stroke-width="1" fill="none"/>
</svg>