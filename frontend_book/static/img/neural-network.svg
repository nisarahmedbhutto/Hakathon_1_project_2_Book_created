<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Neural network nodes -->
  <circle cx="20" cy="30" r="5" fill="#6c5ce7"/>
  <circle cx="20" cy="70" r="5" fill="#6c5ce7"/>
  <circle cx="50" cy="20" r="5" fill="#6c5ce7"/>
  <circle cx="50" cy="50" r="5" fill="#6c5ce7"/>
  <circle cx="50" cy="80" r="5" fill="#6c5ce7"/>
  <circle cx="80" cy="30" r="5" fill="#6c5ce7"/>
  <circle cx="80" cy="70" r="5" fill="#6c5ce7"/>

  <!-- Neural network connections -->
  <line x1="20" y1="30" x2="50" y2="20" stroke="#a29bfe" stroke-width="1"/>
  <line x1="20" y1="30" x2="50" y2="50" stroke="#a29bfe" stroke-width="1"/>
  <line x1="20" y1="70" x2="50" y2="50" stroke="#a29bfe" stroke-width="1"/>
  <line x1="20" y1="70" x2="50" y2="80" stroke="#a29bfe" stroke-width="1"/>
  <line x1="50" y1="20" x2="80" y2="30" stroke="#a29bfe" stroke-width="1"/>
  <line x1="50" y1="50" x2="80" y2="30" stroke="#a29bfe" stroke-width="1"/>
  <line x1="50" y1="50" x2="80" y2="70" stroke="#a29bfe" stroke-width="1"/>
  <line x1="50" y1="80" x2="80" y2="70" stroke="#a29bfe" stroke-width="1"/>
</svg>